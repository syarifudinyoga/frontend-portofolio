services:
  web:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/${IMAGE_NAME:-portfolio-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:?Set API_UPSTREAM in .env}
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    ports:
      - "${WEB_PORT:-8088}:80"
