services:
  frontend:
    image: ghcr.io/${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/portfolio-frontend:${VERSION:-latest}
    container_name: portfolio-frontend
    hostname: frontend
    ports:
      - "127.0.0.1:3005:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      - VITE_API_ENCRYPTION_SECRET=${VITE_API_ENCRYPTION_SECRET:-}
    restart: unless-stopped
    networks:
      - portfolio_default

networks:
  portfolio_default:
    name: portfolio_default
    external: true
